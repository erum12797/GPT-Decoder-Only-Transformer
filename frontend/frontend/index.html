
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Next Character Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 7px;
            min-height: 25px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>GPT Character Predictor</h1>

        <p>Enter text to predict the next character using our trained GPT model.</p>

        <textarea id="inputText" placeholder="Enter your text..."></textarea>

        <button onclick="predict()">Predict Next Character</button>

        <div id="result">Your prediction will appear here.</div>
    </div>

    <script>
        async function predict() {
            const text = document.getElementById("inputText").value;
            const result = document.getElementById("result");

            if (!text) {
                result.textContent = "Please enter some text.";
                return;
            }

            result.textContent = "Predicting...";

            try {
                const response = await fetch(
                    "YOUR_BACKEND_URL/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ text: text })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Prediction failed.");
                }

                result.textContent =
                    "Predicted next character: " +
                    JSON.stringify(data.next_character);

            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
